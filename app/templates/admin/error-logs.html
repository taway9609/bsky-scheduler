{% extends "admin/_base.html" %}
{% set active_page = 'error-logs' %}

{% block title %}エラー Logs{% endblock %}

{% block content %}
<div class="mb-4 d-flex justify-content-between align-items-center">
    <h2 class="page-title"><i class="fas fa-exclamation-triangle me-2"></i>エラーログ</h2>
    <div class="d-flex gap-2">
        <button class="btn btn-outline-primary" onclick="loadErrorLogs()">
            <i class="fas fa-sync-alt me-2"></i>更新
        </button>
        <button class="btn btn-outline-danger" onclick="deleteResolvedLogs()">
            <i class="fas fa-trash me-2"></i>解決済みを削除
        </button>
    </div>
</div>

<div class="mb-3">
    <div class="btn-group" role="group">
        <button type="button" class="btn btn-outline-primary filter-btn active" data-filter="all" onclick="setFilter('all')">すべて</button>
        <button type="button" class="btn btn-outline-danger filter-btn" data-filter="unresolved" onclick="setFilter('unresolved')">未解決</button>
        <button type="button" class="btn btn-outline-success filter-btn" data-filter="resolved" onclick="setFilter('resolved')">解決済み</button>
    </div>
</div>

<div class="admin-card">
    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th style="width: 50px; white-space: nowrap;">ID</th>
                    <th style="width: 80px; white-space: nowrap;">種類</th>
                    <th style="white-space: nowrap;">メッセージ</th>
                    <th style="width: 80px; white-space: nowrap;">ユーザー</th>
                    <th style="width: 150px; white-space: nowrap;">日時</th>
                    <th style="width: 80px; white-space: nowrap;">状態</th>
                    <th style="width: 120px; white-space: nowrap;">操作</th>
                </tr>
            </thead>
            <tbody id="error-logs-tbody">
                <tr>
                    <td colspan="7" class="text-center py-4">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">読み込み中...</span>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="card-footer d-flex justify-content-between align-items-center">
        <div>
            <span id="pagination-info">全 <span id="total-logs">0</span> 件</span>
        </div>
        <nav>
            <ul class="pagination pagination-sm mb-0" id="pagination">
            </ul>
        </nav>
    </div>
</div>

<div class="modal fade" id="logDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-exclamation-circle me-2"></i>エラー詳細</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="logDetailContent">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<input type="hidden" id="admin-token" data-access-token="{{ access_token | default('') }}">
<script src="/static/js/admin/error-logs.js?v=1"></script>
{% endblock %}
