<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}管理画面{% endblock %} - BlueSky 管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/common.css?v=4">
    <link rel="stylesheet" href="/static/css/toasts.css?v=1">
    <link rel="stylesheet" href="/static/css/admin/admin.css?v=2">
</head>
<body>
    <button class="admin-nav-toggle" id="adminNavToggle" aria-label="メニュー">
        <i class="fas fa-bars"></i>
    </button>
    <div class="admin-nav-overlay" id="adminNavOverlay"></div>
    <div class="admin-wrapper">
        <div class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-shield-alt me-2"></i>管理画面</h3>
                <small id="admin-username">{{ username }}</small>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="/admin">
                        <i class="fas fa-tachometer-alt me-2"></i>ダッシュボード
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'users' %}active{% endif %}" href="/admin/users">
                        <i class="fas fa-users me-2"></i>ユーザー管理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'error-logs' %}active{% endif %}" href="/admin/error-logs">
                        <i class="fas fa-exclamation-triangle me-2"></i>エラーログ
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'settings' %}active{% endif %}" href="/admin/settings">
                        <i class="fas fa-cog me-2"></i>アプリ設定
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/bluesky/scheduler">
                        <i class="fas fa-arrow-left me-2"></i>スケジューラーへ戻る
                    </a>
                </li>
                <li class="nav-item">
                    <button class="nav-link theme-toggle-sidebar" onclick="toggleAdminDarkMode()" title="ダークモード切替">
                        <i class="fas fa-moon me-2"></i><span class="theme-text">ダークモード</span>
                    </button>
                </li>
                <li class="nav-item mt-auto">
                    <a class="nav-link" href="#" onclick="logout(); return false;">
                        <i class="fas fa-sign-out-alt me-2"></i>ログアウト
                    </a>
                </li>
            </ul>
        </div>
        <div class="admin-content">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmModalTitle">確認</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="confirmModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                    <button type="button" class="btn btn-danger" id="confirmModalOk">実行</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/js/auth.js?v=4"></script>
    <script src="/static/js/admin/admin.js?v=1"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
