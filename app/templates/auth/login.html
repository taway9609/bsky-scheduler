<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - BlueSky Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/auth/auth.css?v=1">
</head>
<body class="dark-mode" id="login-page">
    <div class="login-card">
        <div class="login-header">
            <i class="fab fa-bluesky"></i>
            <h1>BlueSky Scheduler</h1>
        </div>
        <div class="login-body">
            <div id="error-message" class="error-message"></div>
            
            <form id="login-form">
                <div class="mb-3">
                    <label for="identifier" class="form-label">ユーザー名</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="identifier" name="identifier" required autocomplete="username">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">パスワード</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                    </div>
                </div>
                
                <div class="mb-3 form-check remember-me">
                    <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me" value="true">
                    <label class="form-check-label" for="remember_me">
                        ログイン状態を保持する（90日間）
                    </label>
                </div>
                
                <button type="submit" class="btn btn-login w-100">
                    <i class="fas fa-sign-in-alt me-2"></i>ログイン
                </button>
            </form>
            
            {% if registration_enabled %}
            <div class="register-link">
                <p class="mb-2">アカウントをお持ちでないですか？</p>
                <a href="/auth/register" class="btn btn-outline-primary">
                    <i class="fas fa-user-plus me-2"></i>新規登録
                </a>
            </div>
            {% else %}
            <div class="register-link">
                <p class="mb-2 text-muted">新規登録は停止中です</p>
            </div>
            {% endif %}
        </div>
        <div class="github-link-footer">
            <a href="https://github.com/anomalyco/fastapi-alpha" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-github"></i> GitHub
            </a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/js/auth.js?v=6"></script>
</body>
</html>
