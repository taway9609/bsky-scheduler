<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 - BlueSky Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/auth/auth.css?v=1">
    <link rel="stylesheet" href="/static/css/auth/register.css?v=1">
</head>
<body class="dark-mode">
    <div class="register-card">
        <div class="register-header">
            <i class="fas fa-user-plus"></i>
            <h1>アカウント作成</h1>
            <p class="mb-0">BlueSky Schedulerへようこそ</p>
        </div>
        <div class="register-body">
            {% if not registration_enabled %}
            <div class="disabled-overlay">
                <i class="fas fa-ban"></i>
                <h5>新規登録は停止中です</h5>
                <p class="mb-0 mt-2">現在、新しいアカウントの作成はできなくなっています。<br>管理者にお問い合わせください。</p>
                <a href="/auth/login" class="btn btn-outline-primary mt-3">
                    <i class="fas fa-sign-in-alt me-2"></i>ログイン画面へ
                </a>
            </div>
            {% endif %}
            
            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message">
                登録が完了しました！ログイン画面へリダイレクトします...
            </div>
            
            <form id="register-form" {% if not registration_enabled %}style="opacity: 0.5; pointer-events: none;"{% endif %}>
                <div class="mb-3">
                    <label for="username" class="form-label">ユーザー名</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-at"></i></span>
                        <input type="text" class="form-control" id="username" name="username" required 
                               autocomplete="username" pattern="[a-zA-Z0-9_]+" minlength="3" maxlength="32">
                    </div>
                    <div class="password-requirements">
                        3-32文字、半角英数字とアンダースコアのみ
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">パスワード</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required 
                               autocomplete="new-password" minlength="6" maxlength="128">
                    </div>
                    <div class="password-requirements">
                        6文字以上
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">パスワード（確認）</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required 
                               autocomplete="new-password">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-register w-100" {% if not registration_enabled %}disabled{% endif %}>
                    <i class="fas fa-user-plus me-2"></i>アカウント作成
                </button>
            </form>
            
            <div class="login-link">
                <p class="mb-2">すでにアカウントをお持ちですか？</p>
                <a href="/auth/login" class="btn btn-outline-primary">
                    <i class="fas fa-sign-in-alt me-2"></i>ログイン
                </a>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js?v=1"></script>
    <script src="/static/js/auth/register.js?v=1"></script>
</body>
</html>
