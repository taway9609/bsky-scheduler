<!-- Toast Notification Container -->
<div id="toast-container" class="toast-container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="toast toast-{{ category }}" data-category="{{ category }}" data-message="{{ message }}">
          <div class="toast-content">
            <div class="toast-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                {% if category == 'success' %}
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline points="22 4 12 14.01 9 11.01"></polyline>
                {% elif category == 'error' or category == 'danger' %}
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="15" y1="9" x2="9" y2="15"></line>
                  <line x1="9" y1="9" x2="15" y2="15"></line>
                {% elif category == 'warning' %}
                  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                  <line x1="12" y1="9" x2="12" y2="13"></line>
                  <line x1="12" y1="17" x2="12.01" y2="17"></line>
                {% else %}
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="8" x2="12" y2="12"></line>
                  <line x1="12" y1="16" x2="12.01" y2="16"></line>
                {% endif %}
              </svg>
            </div>
            <div class="toast-text">{{ message }}</div>
          </div>
          <button class="toast-close" aria-label="閉じる">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
          <div class="toast-progress"></div>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
</div>

<!-- JavaScript for toast notifications -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Initialize existing toasts
  const toasts = document.querySelectorAll('.toast');
  toasts.forEach(toast => {
    initToast(toast);
  });

  // Function to initialize a toast
  function initToast(toast) {
    // Set color based on category
    const category = toast.getAttribute('data-category');
    let color = 'var(--primary-color)';
    switch(category) {
      case 'success':
        color = 'var(--success-color)';
        break;
      case 'error':
      case 'danger':
        color = 'var(--danger-color)';
        break;
      case 'warning':
        color = 'var(--warning-color)';
        break;
      case 'info':
        color = 'var(--primary-color)';
        break;
    }
    toast.style.borderLeftColor = color;
    
    // Add animation class after a small delay to ensure it's rendered
    setTimeout(() => {
      toast.classList.add('toast-enter');
    }, 10);
    
    // Auto-dismiss after 5 seconds
    const autoDismiss = setTimeout(() => {
      dismissToast(toast);
    }, 5000);
    
    // Pause auto-dismiss on hover
    toast.addEventListener('mouseenter', () => {
      clearTimeout(autoDismiss);
      // Add a subtle scale animation on hover
      toast.style.transform = 'scale(1.02)';
    });
    
    // Resume auto-dismiss on mouse leave
    toast.addEventListener('mouseleave', () => {
      // Restart auto-dismiss with remaining time
      const remainingTime = 5000 - (Date.now() - toast.dataset.timestamp);
      if (remainingTime > 0) {
        setTimeout(() => {
          dismissToast(toast);
        }, remainingTime);
      }
      toast.style.transform = 'scale(1)';
    });
    
    // Close on X button click
    const closeBtn = toast.querySelector('.toast-close');
    closeBtn.addEventListener('click', () => {
      dismissToast(toast);
    });
    
    // Add timestamp for progress calculation
    toast.dataset.timestamp = Date.now();
    
    // Initialize progress bar
    const progress = toast.querySelector('.toast-progress');
    progress.style.transition = 'width 5s linear';
    progress.style.width = '100%';
    
    // Animate progress bar
    setTimeout(() => {
      progress.style.width = '0%';
    }, 10);
  }
  
  // Function to dismiss a toast
  function dismissToast(toast) {
    toast.classList.remove('toast-enter');
    toast.classList.add('toast-exit');
    
    // Remove from DOM after animation completes
    setTimeout(() => {
      toast.remove();
    }, 300);
  }
  
  // Function to create a new toast
  window.showToast = function(message, category = 'info') {
    // Create new toast element
    const toast = document.createElement('div');
    toast.className = `toast toast-${category}`;
    toast.setAttribute('data-category', category);
    toast.setAttribute('data-message', message);
    
    // Create content structure
    toast.innerHTML = `
      <div class="toast-content">
        <div class="toast-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            ${category === 'success' ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>' : 
             category === 'error' || category === 'danger' ? '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>' : 
             category === 'warning' ? '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line>' : 
             '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>'}
          </svg>
        </div>
        <div class="toast-text">${message}</div>
      </div>
      <button class="toast-close" aria-label="閉じる">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="toast-progress"></div>
    `;
    
    // Add to container
    const container = document.getElementById('toast-container');
    container.appendChild(toast);
    
    // Initialize the new toast
    initToast(toast);
  };
});
</script>
